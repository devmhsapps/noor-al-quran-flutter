name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Flutter Android support files
        run: flutter create --platforms=android --org com.nooralquran --project-name noor_al_quran --no-pub --overwrite .

      - name: Restore custom Android implementation
        run: |
          git checkout -- pubspec.yaml analysis_options.yaml lib test
          git checkout -- android/app/build.gradle.kts android/app/src/main/AndroidManifest.xml android/app/src/main/kotlin/com/nooralquran android/app/src/main/res

      - name: Verify Mosque Mode source
        run: |
          grep -Fq "وضع الجامع" lib/main.dart
          ! grep -Fq "Flutter Demo Home Page" lib/main.dart

      - name: Get packages and test
        run: |
          flutter pub get
          flutter test

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify APK signatures
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          for APK in build/app/outputs/flutter-apk/*-release.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noor-al-quran-apk
          path: build/app/outputs/flutter-apk/*-release.apk

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
